<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth setup guide</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main id="root"><p class="muted">Loading…</p></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "#");
  const list = (items, empty = "None noted.") =>
    items && items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : `<p class="muted">${empty}</p>`;

  function render(g) {
    document.title = `${g.app.name} OAuth setup guide`;
    const review = g.evidence.review || [];
    return `
      <p><a href="/">← All guides</a></p>
      <h1>${esc(g.app.name)}: OAuth app setup</h1>
      <p>
        <span class="badge d-${esc(g.difficulty)}">${esc(g.difficulty)}</span>
        <span class="badge ${g.isLive ? "live" : "verified"}">${g.isLive ? "Agent-generated · not reviewed" : "Verified against live docs"}</span>
        <span class="muted" style="font-size:13px">&nbsp;${g.isLive ? "Generated" : "Last checked"} ${esc(new Date(g.generatedAt).toLocaleDateString(undefined, { timeZone: "UTC", dateStyle: "medium" }))}
        · <a href="${safeUrl(g.app.website)}">${esc(g.app.website)}</a> · <a href="${safeUrl(g.app.docsUrl)}">Provider docs</a></span>
      </p>
      ${g.isLive ? `<p class="notice">An agent wrote this guide from the provider docs listed under Sources, and nobody has reviewed it. Check the Evidence section to see which claims the docs support and which are inferred.</p>` : ""}

      <section class="card">
        <div class="stats">
          <div class="stat"><div class="label">Difficulty</div><div class="value">${esc(g.difficulty)}</div></div>
          <div class="stat"><div class="label">Your active time</div><div class="value">${esc(g.effort.activeTime)}</div></div>
          <div class="stat"><div class="label">Waiting on provider</div><div class="value">${esc(g.effort.waitTime)}</div></div>
          <div class="stat"><div class="label">Approval required</div><div class="value">${g.approval.required ? "Yes" : "No"}</div></div>
        </div>
      </section>

      <section class="split">
        <div class="card"><h2>What an agent can do</h2>${list(g.agentCanDo)}</div>
        <div class="card"><h2>What you must do</h2>${list(g.youMustDo)}</div>
      </section>

      <section class="card">
        <h2>Steps</h2>
        <ol class="steps">${g.steps.map((s) => `<li><strong>${esc(s.title)}</strong>
          <span class="tag ${s.automatable ? "agent" : "you"}">${s.automatable ? "agent can help" : "you"}</span>
          <div>${esc(s.detail)}</div></li>`).join("")}</ol>
      </section>

      <section class="card">
        <h2>Approval and review</h2>
        <p>${g.approval.required ? "" : "<strong>No mandatory review found.</strong> "}${esc(g.approval.process) || '<span class="muted">No review process described.</span>'}</p>
        <p><strong>Typical wait:</strong> ${esc(g.approval.typicalWait)}</p>
        <h3>What causes rejection or delay</h3>${list(g.approval.rejectionRisks)}
      </section>

      <section class="card">
        <h2>If you get stuck</h2>
        ${g.blockers.length ? `<ul>${g.blockers.map((b) => `<li><strong>${esc(b.issue)}</strong><br>${esc(b.whatToDo)}</li>`).join("")}</ul>` : '<p class="muted">None noted.</p>'}
      </section>

      <section class="card">
        <h2>Gotchas</h2>${list(g.gotchas)}
      </section>

      <section class="card">
        <h2>Evidence</h2>
        ${review.length ? `<h3>Review against the live docs</h3>${list(review)}` : ""}
        <div class="ev-verified"><h3>Supported by the provider's docs</h3>${list(g.evidence.verified)}</div>
        <div class="ev-inferred"><h3>Inferred (not stated in the sources)</h3>${list(g.evidence.inferred)}</div>
        <div class="ev-unverifiable"><h3>Couldn't be determined</h3>${list(g.evidence.unverifiable)}</div>
      </section>

      <section class="card">
        <h2>Sources</h2>
        ${g.sources.length ? `<ul>${g.sources.map((s) => `<li><a href="${safeUrl(s.url)}">${esc(s.title || s.url)}</a></li>`).join("")}</ul>` : '<p class="muted">None.</p>'}
      </section>`;
  }

  (async () => {
    const root = document.getElementById("root");
    const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const res = await fetch(`/api/guides/${encodeURIComponent(slug)}`);
    root.innerHTML = res.ok
      ? render(await res.json())
      : `<p><a href="/">← All guides</a></p><div class="error">No guide found for “${esc(slug)}”. Generated guides are stored in a database that resets when the app is redeployed, so older links may stop working.</div>`;
  })();
</script>
</body>
</html>
